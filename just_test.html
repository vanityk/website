<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
  .vi {
    width: 100vw;
    aspect-ratio: 16 / 9;
    margin: 0;
    display: block;
    pointer-events: none;
  }
  /* 關鍵：在影片上方加一層透明遮罩，徹底阻擋滑鼠互動與瞬間彈出的按鈕 */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div>
    <iframe class="vi"
      src="https://www.youtube.com/embed/WjJZufaOv3o?autoplay=1&mute=1&loop=1&playlist=WjJZufaOv3o&controls=0&disablekb=1">
    </iframe>
    <div class="video-overlay"></div>
  </div>

</body>
</html>
